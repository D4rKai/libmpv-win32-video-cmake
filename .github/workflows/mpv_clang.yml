name: mpv clang
defaults:
  run:
    shell: bash

# atlas-af1: rebuild of the media-kit 20241021 libmpv (mpv 0f78584, FFmpeg
# 8d940a07d, every dependency pinned to its 2024-10-21 commit) with the LGPL
# audio filters enabled. Only x86_64 and aarch64 are built; the release goes
# to this repository.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Run custom command before building'
        required: false
        type: string
      github_release:
        description: 'Upload to Github release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag'
        required: false
        default: '20241021-atlas-af1'
        type: string
      cache_prefix:
        description: 'Cache key prefix (change it to start from scratch)'
        required: false
        default: 'af1'
        type: string

permissions:
  contents: write

env:
  # CMake 4 in the build image refuses cmake_minimum_required(< 3.5) of the
  # 2024 package sources; this keeps them building unchanged.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  # rust 1.86 + crates resolved today: pick crate versions that still build with it.
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  build_mpv:
    name: Building mpv
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bit: [x86_64, aarch64]
    env:
      BIT: ${{ matrix.bit }}
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Init variable
        run: |
          if [[ $BIT == "i686" ]]; then
            echo "arch=i686" >> $GITHUB_ENV
          elif [[ $BIT == "x86_64" ]]; then
            echo "arch=x86_64" >> $GITHUB_ENV
          elif [[ $BIT == "x86_64_v3" ]]; then
            echo "arch=x86_64" >> $GITHUB_ENV
            echo "x86_64_level=-v3" >> $GITHUB_ENV
          elif [[ $BIT == "aarch64" ]]; then
            echo "arch=aarch64" >> $GITHUB_ENV
          fi

      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}

      - name: Loading clang sysroot cache
        uses: actions/cache/restore@main
        with:
          path: |
            clang_root
          key: ${{ inputs.cache_prefix }}-clang_root-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_prefix }}-clang_root

      - name: Loading repository cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ inputs.cache_prefix }}-repository-${{ matrix.bit }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_prefix }}-repository-${{ matrix.bit }}

      - name: Loading ${{ matrix.bit }} toolchain cache
        uses: actions/cache/restore@main
        with:
          path: |
            build_${{ matrix.bit }}
          key: ${{ inputs.cache_prefix }}-clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_prefix }}-clang-${{ matrix.bit }}_toolchain

      - name: Running custom command
        if: ${{ github.event.inputs.command != '' }}
        continue-on-error: true
        run: ${{ github.event.inputs.command }}

      - name: Configuring CMake & Downloading source
        run: |
          if [[ $BIT == x86_64_v3 ]]; then echo "x86_64_v3_ARCH=-DGCC_ARCH=x86-64-v3" >> $GITHUB_ENV; fi
          cmake -DTARGET_ARCH=${{ env.arch }}-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang ${{ env.x86_64_v3_ARCH }} -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_$BIT/$BIT-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON -G Ninja --fresh -B build_$BIT -S $PWD
          ninja -C build_$BIT download || true

      - name: Building mpv
        run: |
          # No `ninja update`: every source is pinned (GIT_TAG <sha>) to the
          # commit the upstream 20241021 build used.
          # The llvm toolchain workflow must have completed for this arch.
          test -f clang_root/.atlas-pgo && test -f build_$BIT/.atlas-toolchain
          ninja -C build_$BIT llvm-copy-builtin
          ninja -C build_$BIT mpv
          test "$(git -C src_packages/mpv rev-parse HEAD)" = 0f7858451817c5fd5ebdb74a807a7c997662c390
          test "$(git -C src_packages/ffmpeg rev-parse HEAD)" = 8d940a07d19023a98689f353e4425a14688547e9

      - name: Packaging mpv
        run: |
          mkdir -p release_$BIT
          ninja -C build_$BIT mpv-packaging; mv build_$BIT/mpv*.7z release_$BIT
          if [[ $BIT == x86_64_v3 ]]; then for dir in release_$BIT/mpv-*; do name=$(basename $dir); mv $dir $(dirname $dir)/${name/x86_64/x86_64-v3}; done; fi

      - name: Checking audio filters in libmpv-2.dll
        run: |
          dev=$(ls release_$BIT/mpv-dev-${{ env.arch }}-*.7z)
          rm -rf check && mkdir check && 7z e -ocheck "$dev" libmpv-2.dll > /dev/null
          ls -l check/libmpv-2.dll
          for f in acompressor alimiter equalizer pan volume aresample aformat anull asplit amix highpass lowpass bandpass astats ametadata ebur128 silencedetect dynaudnorm; do
            n=$(grep -a -c -w "$f" check/libmpv-2.dll || true)
            echo "$f $n"
            test "$n" -gt 0
          done
          sha256sum release_$BIT/*.7z
          md5sum release_$BIT/*.7z
          rm -rf check

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p build_${BIT}_logs
          cp -fr $(find build_$BIT -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") build_${BIT}_logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z build*logs

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: mpv-${{ matrix.bit }}-logs
          path: logs.7z
          retention-days: 7

      - name: Uploading ${{ matrix.bit }} build
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ matrix.bit }}
          path: release_${{ matrix.bit }}/mpv-*${{ env.arch }}*
          retention-days: 7

      - name: Cleaning build directory
        if: always()
        run: |
          rm -rf build_$BIT/mpv*
          rm -rf release_$BIT/mpv-debug*.7z

      - name: Cleaning rust toolchain directory
        if: always()
        run: |
          ninja -C build_$BIT cargo-clean || true

      - name: Saving repository cache
        uses: actions/cache/save@main
        if: always()
        with:
          path: src_packages
          key: ${{ inputs.cache_prefix }}-repository-${{ matrix.bit }}-${{ github.run_id }}

      - name: Saving ${{ matrix.bit }} toolchain cache
        uses: actions/cache/save@main
        if: always()
        with:
          path: |
            build_${{ matrix.bit }}
          key: ${{ inputs.cache_prefix }}-clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}

      - name: Saving release_${{ matrix.bit }} cache
        uses: actions/cache/save@main
        with:
          path: release_${{ matrix.bit }}
          key: ${{ inputs.cache_prefix }}-release_${{ matrix.bit }}-${{ github.run_id }}

  release:
    name: Upload releases
    runs-on: ubuntu-latest
    needs: build_mpv
    if: ${{ inputs.github_release }}
    env:
      GH_TOKEN: ${{ github.token }}
      release_x86_64_key: ${{ inputs.cache_prefix }}-release_x86_64-${{ github.run_id }}
      release_aarch64_key: ${{ inputs.cache_prefix }}-release_aarch64-${{ github.run_id }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}

      - name: Loading release_x86_64 cache
        uses: actions/cache/restore@main
        with:
          path: release_x86_64
          key: ${{ env.release_x86_64_key }}
          fail-on-cache-miss: true

      - name: Loading release_aarch64 cache
        uses: actions/cache/restore@main
        with:
          path: release_aarch64
          key: ${{ env.release_aarch64_key }}
          fail-on-cache-miss: true

      - name: Uploading packages to Github release
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release
          mv release_x86_64/*.7z release_aarch64/*.7z release
          (cd release && sha256sum *.7z > SHA256SUMS && md5sum *.7z > MD5SUMS && cat SHA256SUMS MD5SUMS)
          cat > notes.md <<END
          media-kit libmpv-win32-video-cmake 20241021 rebuilt with the LGPL audio filters
          (acompressor, alimiter, equalizer, pan, volume, aresample, aformat, anull, asplit,
          amix, highpass, lowpass, bandpass, astats, ametadata, ebur128, silencedetect,
          dynaudnorm). Same mpv (0f78584) and FFmpeg (8d940a07d) as 20241021, every other
          source pinned to its 2024-10-21 commit; no --enable-gpl, no --enable-nonfree.

          **Workflow run**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          END
          gh release create "$TAG" release/*.7z release/SHA256SUMS release/MD5SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
