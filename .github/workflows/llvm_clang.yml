name: llvm toolchain
defaults:
  run:
    shell: bash

# atlas-af1: the 20241021 toolchain (LLVM release/19.x, mingw-w64, ... pinned
# to their 2024-10-21 commits), only for x86_64 and aarch64.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Run custom command before building'
        required: false
        type: string
      cache_prefix:
        description: 'Cache key prefix (must match the one given to mpv clang)'
        required: false
        default: 'af1'
        type: string

permissions:
  contents: read

env:
  # CMake 4 in the build image refuses cmake_minimum_required(< 3.5) of the
  # 2024 sources; this keeps them building unchanged.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  # rust 1.86 + crates resolved today: pick crate versions that still build with it.
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  build_llvm:
    name: Building LLVM and Clang
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
    container:
        image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}

      - name: Loading clang root
        id: clang_root_cache
        uses: actions/cache/restore@main
        with:
          path: clang_root
          key: ${{ inputs.cache_prefix }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ inputs.cache_prefix }}-clang_root

      - name: Loading x86_64 toolchain
        id: x86_64_cache
        uses: actions/cache/restore@main
        with:
          path: build_x86_64
          key: ${{ inputs.cache_prefix }}-clang-x86_64_toolchain-${{ github.run_id }}
          restore-keys: ${{ inputs.cache_prefix }}-clang-x86_64_toolchain

      - name: Loading aarch64 toolchain
        id: aarch64_cache
        uses: actions/cache/restore@main
        with:
          path: build_aarch64
          key: ${{ inputs.cache_prefix }}-clang-aarch64_toolchain-${{ github.run_id }}
          restore-keys: ${{ inputs.cache_prefix }}-clang-aarch64_toolchain

      # Sources of a toolchain build that failed half-way (its build trees
      # are in the toolchain caches), so the next run resumes it.
      - name: Loading unfinished toolchain sources
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ inputs.cache_prefix }}-toolchain-src-${{ github.run_id }}
          restore-keys: ${{ inputs.cache_prefix }}-toolchain-src

      - name: Dropping build stamps that lost their sources
        run: |
          for b in build_x86_64 build_aarch64; do
            if [ -d "$b/toolchain" ] && [ ! -d src_packages/llvm/.git ]; then
              echo "dropping $b/toolchain and $b/packages (no cached sources)"
              rm -rf "$b/toolchain" "$b/packages"
            fi
          done

      - name: Running custom command
        if: ${{ github.event.inputs.command != '' }}
        continue-on-error: true
        run: ${{ github.event.inputs.command }}

      # Markers instead of cache hits, so a failed run resumes where it
      # stopped (the caches below are saved even on failure).
      - name: Checking state
        id: state
        run: |
          for m in clang_root/.atlas-llvm-gen clang_root/.atlas-pgo build_x86_64/.atlas-toolchain build_aarch64/.atlas-toolchain; do
            k=$(echo "$m" | tr '/.-' '___'); test -f "$m" && v=1 || v=0; echo "$k=$v" >> $GITHUB_OUTPUT; echo "$m $v"
          done

      - name: Building LLVM with IR Profile Instrumentation
        if: ${{ steps.state.outputs.clang_root__atlas_llvm_gen != '1' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm
          ninja -C build_x86_64 rustup
          ninja -C build_x86_64 cargo-clean || true
          touch clang_root/.atlas-llvm-gen

      - name: Building x86_64 toolchain
        if: ${{ steps.state.outputs.build_x86_64__atlas_toolchain != '1' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm-clang
          touch build_x86_64/.atlas-toolchain

      - name: Building aarch64 toolchain
        if: ${{ steps.state.outputs.build_aarch64__atlas_toolchain != '1' }}
        run: |
          cmake -DTARGET_ARCH=aarch64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_aarch64/aarch64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_aarch64 -S $PWD
          ninja -C build_aarch64 llvm-clang
          touch build_aarch64/.atlas-toolchain

      - name: PGO training with shaderc
        if: ${{ steps.state.outputs.clang_root__atlas_pgo != '1' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCLANG_PACKAGES_LTO=ON -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 shaderc

      - name: Merging profraw to profdata
        if: ${{ steps.state.outputs.clang_root__atlas_pgo != '1' }}
        run: |
          llvm-profdata merge $PWD/clang_root/profiles/*.profraw -o llvm.profdata
          rm -rf $PWD/clang_root/profiles/* || true

      - name: Building LLVM with PGO
        if: ${{ steps.state.outputs.clang_root__atlas_pgo != '1' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=USE -DLLVM_PROFDATA_FILE="llvm.profdata" -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm
          touch clang_root/.atlas-pgo

      - name: Cleanup
        run: |
          rm -rf {build_x86_64,build_aarch64}/{toolchain,packages} || true

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p build_x86_64_logs build_aarch64_logs
          cp -fr $(find build_x86_64 -type f -iname "*-*.log") build_x86_64_logs || true
          cp -fr $(find build_aarch64 -type f -iname "*-*.log") build_aarch64_logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z build*logs

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: logs
          path: logs.7z
          retention-days: 7

      - name: Cache sizes
        if: always()
        run: du -sh clang_root build_x86_64 build_aarch64 src_packages 2>/dev/null || true

      - name: Saving unfinished toolchain sources
        if: failure()
        uses: actions/cache/save@main
        with:
          path: src_packages
          key: ${{ inputs.cache_prefix }}-toolchain-src-${{ github.run_id }}

      - name: Saving clang root
        if: always()
        uses: actions/cache/save@main
        with:
          path: clang_root
          key: ${{ inputs.cache_prefix }}-clang_root-${{ github.run_id }}

      - name: Saving x86_64 toolchain
        if: always()
        uses: actions/cache/save@main
        with:
          path: build_x86_64
          key: ${{ inputs.cache_prefix }}-clang-x86_64_toolchain-${{ github.run_id }}

      - name: Saving aarch64 toolchain
        if: always()
        uses: actions/cache/save@main
        with:
          path: build_aarch64
          key: ${{ inputs.cache_prefix }}-clang-aarch64_toolchain-${{ github.run_id }}
